<!DOCTYPE html>
<html lang="su">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kitab Bandongan & Nadoman Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    // Pasang library Supabase (tambahkeun ieu di HTML anjeun)
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
    /* 1. RESET DASAR */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: sans-serif; }
    .font-arab { font-family: 'Amiri', serif; }

    /* 2. LAYOUT KERTAS (PREVIEW APLIKASI) */
    .lembar-f4-cetak {
        width: 330mm; 
        height: 215mm;
        min-width: 330mm;
        min-height: 215mm;
        max-height: 215mm; /* Dikonci supaya preview aplikasi stabil */
        background-color: #ffffff; 
        color: #1e293b;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        border: none !important; /* <--- IEU NU DIROBAH */
        display: flex; 
        position: relative; 
        overflow: hidden; 
        margin: 20px auto; /* Spasi antar kertas dina preview */
    }

    .sub-halaman {
        width: 165mm; 
        height: 215mm; 
        padding: 12mm 12mm;
        display: flex; 
        flex-direction: column; 
        justify-content: space-between; 
        overflow: hidden;
        
    }

    .garis-lipat {
        position: absolute; 
        left: 50%; top: 0; bottom: 0; 
        width: 1px;
        border-left: 1px dashed #cbd5e1; 
        transform: translateX(-50%); 
        z-index: 10;
    }

    /* 3. KOMPONEN LAINNA */
    .baris-dragged { opacity: 0.4; background-color: #312e81 !important; }

    .wadah-rangkuman-cetak {
        position: relative;
        background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
        background-size: 100% 24px;
        line-height: 24px;
        padding-top: 4px;
        border-bottom: 1px solid #e5e7eb;
    }

    .konten-accordion {
        max-height: 2000px;
        overflow: hidden;
        transition: max-height 0.3s ease-out, padding 0.3s ease-out;
    }
    .konten-accordion.tutup {
        max-height: 0 !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        border: none !important;
    }

    .lafadz-klik {
        cursor: pointer;
        transition: all 0.2s;
        display: inline-block;
        padding: 0 4px;
        border-radius: 4px;
    }
    .lafadz-klik:hover {
        background-color: #065f46;
        color: #ffffff;
        transform: scale(1.1);
    }

    /* 4. SETELAN CETAK (PRINT) - AGGRESSIVE RESET */
    @media print {
        @page { size: 330mm 215mm; margin: 0 !important; }
        
        /* Sumputkeun sidebar & elemen teu perlu */
        .no-print, #file-input, #judul-preview, div[style*="width: 480px"], .bg-slate-800.flex-shrink-0 { 
            display: none !important; 
        }

        /* Bersihkeun indung layout */
        html, body, .flex, .h-screen, .overflow-hidden {
            display: block !important;
            height: auto !important;
            overflow: visible !important;
            background: #ffffff !important;
            color: #000000 !important;
            margin: 0 !important;
        }

        /* Wadah kertas cetak */
        #wadah-kertas-cetak {
            display: block !important;
            width: 330mm !important;
            height: auto !important;
            margin: 0 !important;
        }

        /* Lembar F4 cetakan */
        .lembar-f4-cetak {
            display: flex !important; 
            flex-direction: row !important;
            width: 330mm !important; 
            height: 215mm !important;
            page-break-after: always !important; 
            break-after: page !important;
            break-inside: avoid !important;
            box-shadow: none !important; 
            border: none !important;
            margin: 0 !important; 
            position: relative !important;
        }

        .sub-halaman { width: 165mm !important; height: 215mm !important; }
        .garis-lipat { border-left: 1px dashed #94a3b8 !important; }
    }

    /* Ngahapus garis kotak tina tabel atanapi div kontén di jero kitab */
    .lembar-f4-cetak table, 
    .lembar-f4-cetak td, 
    .lembar-f4-cetak div, 
    .kotak-bandongan-satuan {
        border: none !important;
        outline: none !important;
    }

    /* Upami anjeun hoyong ngahapus garis kotak anu masih némbongan dina print */
    @media print {
        .lembar-f4-cetak * {
            border: none !important;
        }
        /* Tetepkeun garis tengah (garis lipat) supados aya panduan */
        .garis-lipat {
            border-left: 1px dashed #cbd5e1 !important;
        }
    }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- WADAH UTAMA: Ngonci sangkan pas sagedé layar monitor (no global scroll) -->
    <div class="flex w-full h-screen overflow-hidden">
        
        <!-- ======================================================= -->
        <!-- 1. PANEL INPUTAN (KENCA) - DIKONCI 480px PASTI MOAL NGESER -->
        <!-- ======================================================= -->
        <div style="width: 480px; min-width: 480px; max-width: 480px;" class="h-full bg-slate-800 flex flex-col border-r border-slate-700 no-print overflow-hidden">
            
            <!-- PANEL TOP BAR NU DIKUNCI (MOAL MILU KA-SCROLL) -->
            <div class="bg-slate-900 border-b border-slate-700 shadow-lg p-3 space-y-3 z-30 flex-shrink-0">
                <!-- HEADER UTAMA & TOMBOL UTAMA -->
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-sm font-bold text-indigo-400">Bandongan & Nadoman Studio</h1>
                        <p class="text-[10px] text-slate-400">Klik kolom Bandongan heula, klik lafadz ti luhur.</p>
                    </div>
                    <div class="flex gap-1.5">
                        <button onclick="simpanKabehFasal()" class="bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold py-1 px-2.5 rounded cursor-pointer transition">
                            💾 Simpan Kitab
                        </button>
                        <label class="bg-slate-700 hover:bg-slate-600 text-white text-[11px] font-bold py-1 px-2.5 rounded cursor-pointer transition">
                            📂 Buka Kitab
                            <input type="file" id="file-input" accept=".json" onchange="bukaDariFile(event)" class="hidden">
                        </label>
                    </div>
                </div>

                <!-- TOMBOL JINIS BARIS NU DIKUNCI -->
                <div class="flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800">
                    <span class="text-[11px] font-bold text-amber-400 uppercase tracking-wider">➕ Tambah Baris Anyar:</span>
                    <div class="flex gap-1.5">
                        <button onclick="tambahBaris('arabfull')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[11px] py-1.5 px-2 rounded cursor-pointer transition shadow-sm">
                            Teks Arab Full
                        </button>
                        <button onclick="tambahBaris('bandongan')" class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-[11px] py-1.5 px-2 rounded cursor-pointer transition shadow-sm">
                            Bandongan
                        </button>
                        <button onclick="tambahBaris('nadoman')" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold text-[11px] py-1.5 px-2 rounded cursor-pointer transition shadow-sm">
                            Nadoman
                        </button>
                    </div>
                </div>
            </div>

            <!-- WADAH EUSI NAVIGASI NU TIASA DI-SCROLL BÉBAS -->
            <div class="flex-1 p-4 overflow-y-auto space-y-3 pb-28">
                
                <!-- SECTION 1: MANAJEMEN FASAL -->
                <div class="bg-slate-900 rounded border border-slate-700 overflow-hidden">
                    <button onclick="toggleAccordion('acc-fasal', 'panah-fasal')" class="w-full flex justify-between items-center p-2.5 bg-slate-950/80 text-left cursor-pointer hover:bg-slate-950 transition">
                        <span class="text-xs font-bold text-indigo-300 uppercase tracking-wider">1. Daptar & Navigasi Fasal</span>
                        <span id="panah-fasal" class="text-xs text-indigo-400 transition-transform duration-200">▼</span>
                    </button>
                    <div id="acc-fasal" class="konten-accordion p-2.5 space-y-2">
                        <div id="wadah-tab-fasal" class="flex flex-col gap-1 max-h-[120px] overflow-y-auto p-1 bg-slate-950 rounded border border-slate-800"></div>
                        <div class="flex justify-between items-center">
                            <button onclick="tambahFasalEnggal()" class="text-[10px] bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1 px-2.5 rounded cursor-pointer">
                                ➕ Tambah Fasal Anyar
                            </button>
                        </div>
                        <div class="flex gap-2 pt-1 border-t border-slate-800">
                            <input type="text" id="edit-nama-fasal" oninput="gantiNamaFasalAktip(this.value)" class="flex-1 p-1 bg-slate-950 text-slate-200 rounded border border-slate-700 text-xs focus:outline-none focus:border-indigo-500" placeholder="Ganti nami fasal aktip...">
                            <button onclick="hapusFasalAktip()" class="text-[11px] bg-red-900/60 hover:bg-red-800 text-red-200 px-2 rounded border border-red-700">Hapus</button>
                        </div>
                    </div>
                </div>

                <!-- SECTION 2: KOTAK ISIAN RANGKUMAN -->
                <div class="bg-slate-900 rounded border border-slate-700 overflow-hidden">
                    <button onclick="toggleAccordion('acc-rangkuman', 'panah-rangkuman')" class="w-full flex justify-between items-center p-2.5 bg-slate-950/80 text-left cursor-pointer hover:bg-slate-950 transition">
                        <span class="text-xs font-bold text-purple-400 uppercase tracking-wider">2. Kotak Isian Rangkuman</span>
                        <span id="panah-rangkuman" class="text-xs text-purple-400 transition-transform duration-200">▼</span>
                    </button>
                    <div id="acc-rangkuman" class="konten-accordion p-2.5">
                        <textarea id="input-rangkuman-fasal" oninput="updateRangkumanFasal(this.value)" class="w-full p-1.5 bg-slate-950 text-slate-200 rounded border border-slate-700 text-xs h-20 focus:outline-none focus:border-purple-500" placeholder="Eusi rangkuman di dieu..."></textarea>
                    </div>
                </div>

                <!-- SECTION 3: MATRIKS BARIS INPUTAN -->
                <div class="bg-slate-900 rounded border border-slate-700 overflow-hidden">
                    <div class="w-full p-2.5 bg-slate-950/80 text-left border-b border-slate-800">
                        <span class="text-xs font-bold text-amber-400 uppercase tracking-wider">3. Eusi Baris Kitab & Susunan Logat</span>
                    </div>
                    
                    <div class="flex flex-col p-2">
                        <div class="flex bg-slate-950 p-1.5 text-[10px] font-bold text-slate-400 rounded-t border-t border-x border-slate-800">
                            <div class="w-[6%] text-center">☰</div>
                            <div class="w-[16%] text-indigo-400">Jinis Baris</div>
                            <div class="w-[72%] text-center text-slate-300">Kolom Eusi Konten</div>
                            <div class="w-[6%] text-center">✕</div>
                        </div>
                        
                        <div id="wadah-baris-input" class="bg-slate-950 rounded-b border border-slate-800 p-1.5 space-y-2"></div>
                    </div>
                </div>
            </div>

            <!-- TOMBOL CETAK NANGKLED DI HANDAP (FLOATING FIXED) -->
            <div class="p-4 bg-slate-900 border-t border-slate-700 shadow-2xl grid grid-cols-2 gap-2 mt-auto z-30 flex-shrink-0">
                <button onclick="cetakBuku('sadaya')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-2 rounded transition shadow-md cursor-pointer text-[11px] uppercase tracking-wider text-center">
                    🖨️ Cetak Sadaya Fasal
                </button>
                <button onclick="cetakBuku('terpilih')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-2 rounded transition shadow-md cursor-pointer text-[11px] uppercase tracking-wider text-center">
                    ✨ Cetak Terpilih
                </button>
            </div>
        </div>

        <!-- ======================================================= -->
        <!-- 2. PANEL PREVIEW BUKU (KATUHUKUN) - OTOMATIS NGAGUSER SESA LAYAR -->
        <!-- ======================================================= -->
        <div class="flex-1 h-full bg-slate-950 overflow-auto p-6 flex flex-col items-center">
            <h2 id="judul-preview" class="text-xs font-semibold text-slate-400 mb-4 pb-1 border-b border-slate-800 w-full text-center no-print flex-shrink-0">
                Sawangan Cetak Buku Lipat Tengah
            </h2>
            <!-- Wadah kertas dipaparin margin otomatis supados rapih di tengah sésa rohangan -->
            <div id="wadah-kertas-cetak" class="w-full flex flex-col items-center gap-8 pb-16"></div>
        </div>
        
    </div>

    <script>
        let kitabData = [
            {
                nama: "MUQODDIMAH",
                rangkuman: "❖ Rukun Islam aya 5 perkara.",
                dicitak: true,
                baris: [
                    { tipe: "arabfull", teks: "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ" }
                ]
            }
        ];

        let indexFasalAktip = 0;
        let indexBarisAktip = 0;
        let barisNuKeurDiDrag = null;
        let modeCetak = "sadaya";

        function toggleAccordion(idKonten, idPanah) {
            const konten = document.getElementById(idKonten);
            const panah = document.getElementById(idPanah);
            if (!konten || !panah) return;
            if (konten.classList.contains('tutup')) {
                konten.classList.remove('tutup');
                panah.style.transform = 'rotate(0deg)';
            } else {
                konten.classList.add('tutup');
                panah.style.transform = 'rotate(-90deg)';
            }
        }

        function renderTabFasal() {
            const wadahTab = document.getElementById('wadah-tab-fasal');
            if (!wadahTab) return;
            wadahTab.innerHTML = '';
            
            kitabData.forEach((fasal, idx) => {
                const rowTab = document.createElement('div');
                rowTab.className = `flex items-center justify-between p-1 rounded border transition ${idx === indexFasalAktip ? 'bg-slate-800 border-indigo-500' : 'bg-slate-900 border-slate-800'}`;
                
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = fasal.dicitak !== false;
                cb.className = 'mr-2 accent-indigo-500 cursor-pointer';
                cb.onclick = (e) => {
                    e.stopPropagation();
                    fasal.dicitak = cb.checked;
                    prosesTeksMenjadiBooklet();
                };

                const btn = document.createElement('button');
                btn.className = `flex-1 text-left text-[11px] font-bold truncate transition cursor-pointer ${idx === indexFasalAktip ? 'text-indigo-400' : 'text-slate-400 hover:text-slate-200'}`;
                btn.textContent = `${idx + 1}. ${fasal.nama || 'TANPA NAMA'}`;
                btn.onclick = () => {
                    indexFasalAktip = idx;
                    indexBarisAktip = 0;
                    bukaFasalAktip();
                };

                rowTab.appendChild(cb);
                rowTab.appendChild(btn);
                wadahTab.appendChild(rowTab);
            });
            const inputNama = document.getElementById('edit-nama-fasal');
            if (inputNama) inputNama.value = kitabData[indexFasalAktip].nama;
        }

        function tambahFasalEnggal() {
            const namaAnyar = "FASAL " + (kitabData.length + 1);
            kitabData.push({ nama: namaAnyar, rangkuman: "", dicitak: true, baris: [] });
            indexFasalAktip = kitabData.length - 1;
            indexBarisAktip = 0;
            bukaFasalAktip();
        }

        function gantiNamaFasalAktip(val) {
            kitabData[indexFasalAktip].nama = val.toUpperCase();
            renderTabFasal();
            prosesTeksMenjadiBooklet();
        }

        function hapusFasalAktip() {
            if (kitabData.length > 1) {
                kitabData.splice(indexFasalAktip, 1);
                indexFasalAktip = Math.max(0, indexFasalAktip - 1);
                indexBarisAktip = 0;
                bukaFasalAktip();
            } else {
                alert("Teu tiasa dihapus!");
            }
        }

        function updateRangkumanFasal(val) {
            kitabData[indexFasalAktip].rangkuman = val;
            prosesTeksMenjadiBooklet();
        }

        function bukaFasalAktip() {
            renderTabFasal();
            const inputRangkuman = document.getElementById('input-rangkuman-fasal');
            if (inputRangkuman) inputRangkuman.value = kitabData[indexFasalAktip].rangkuman || "";
            renderBarisInput();
            prosesTeksMenjadiBooklet();
        }

        function selipkanLafadzKeBandongan(indexArabFull, lafadz) {
            const barisFasal = kitabData[indexFasalAktip].baris;
            
            if (barisFasal[indexBarisAktip] && barisFasal[indexBarisAktip].tipe === "bandongan") {
                let barisAktip = barisFasal[indexBarisAktip];
                if (barisAktip.arab && barisAktip.arab.trim() !== "") {
                    barisAktip.arab = barisAktip.arab.trim() + " " + lafadz.trim();
                } else {
                    barisAktip.arab = lafadz.trim();
                }
            } 
            else if (barisFasal[indexArabFull + 1] && barisFasal[indexArabFull + 1].tipe === "bandongan") {
                let barisHandap = barisFasal[indexArabFull + 1];
                if (barisHandap.arab && barisHandap.arab.trim() !== "") {
                    barisHandap.arab = barisHandap.arab.trim() + " " + lafadz.trim();
                } else {
                    barisHandap.arab = lafadz.trim();
                }
                indexBarisAktip = indexArabFull + 1;
            } 
            else {
                const barisAnyar = {
                    tipe: "bandongan",
                    luhur: "",
                    arab: lafadz.trim(),
                    sunda: ""
                };
                barisFasal.splice(indexArabFull + 1, 0, barisAnyar);
                indexBarisAktip = indexArabFull + 1;
            }
            
            renderBarisInput();
            prosesTeksMenjadiBooklet();
        }

        function buatVisualLafadzKlik(teks, indexBaris) {
            if (!teks || teks.trim() === "") return `<span class="text-slate-500 italic text-[11px]">Ketikkeun teks arab di kolom handap...</span>`;
            const kumpulanKecap = teks.split(/(\s+)/);
            return kumpulanKecap.map(item => {
                if (item.trim() === "") return item;
                return `<span class="lafadz-klik font-arab text-lg font-bold text-emerald-400 cursor-pointer" onclick="selipkanLafadzKeBandongan(${indexBaris}, '${item.replace(/'/g, "\\'")}')">${item}</span>`;
            }).join('');
        }

        function renderBarisInput() {
            const wadah = document.getElementById('wadah-baris-input');
            if (!wadah) return;
            wadah.innerHTML = '';
            const dataBaris = kitabData[indexFasalAktip].baris;

            dataBaris.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = `flex gap-1.5 items-center p-1 bg-slate-900/50 rounded border transition ${index === indexBarisAktip ? 'border-amber-500 bg-slate-800/80 ring-1 ring-amber-500/30' : 'border-slate-800'}`;
                row.setAttribute('draggable', 'true');
                row.setAttribute('data-index', index);
                
                row.onclick = () => { setBarisAktip(index); };
                
                row.addEventListener('dragstart', handleDragStart);
                row.addEventListener('dragover', handleDragOver);
                row.addEventListener('drop', handleDrop);
                row.addEventListener('dragend', handleDragEnd);

                let htmlKontenInput = '';
                
                if (item.tipe === 'arabfull') {
                    const visualLafadz = buatVisualLafadzKlik(item.teks, index);
                    htmlKontenInput = `
                        <div class="w-[16%] flex flex-col justify-center">
                            <span class="text-[10px] font-bold text-emerald-400 uppercase block">Arab Full</span>
                            <span class="text-[8px] text-slate-400 font-sans leading-tight">Klik lafadz pikeun gabung ka handap 👇</span>
                        </div>
                        <div class="w-[72%] flex flex-col gap-1.5 bg-slate-950 p-2 rounded border border-emerald-900">
                            <div class="p-1.5 bg-slate-900 rounded border border-slate-800 text-right min-h-[36px] flex flex-row-reverse flex-wrap gap-x-1 items-center" style="direction: rtl;">
                                ${visualLafadz}
                            </div>
                            <input type="text" value="${item.teks || ''}" onfocus="setBarisAktip(${index})" oninput="updateDataArabFull(${index}, this.value)" class="w-full p-1 bg-slate-900 text-slate-100 font-arab text-sm text-right rounded border border-slate-700 focus:border-emerald-500" placeholder="Ketik/Paste Teks Arab Full di dieu...">
                        </div>
                    `;
                } else if (item.tipe === 'nadoman') {
                    htmlKontenInput = `
                        <div class="w-[16%] text-[10px] font-bold text-cyan-400 uppercase">Nadoman</div>
                        <div class="w-[72%] flex gap-1 bg-slate-950 p-1 rounded border border-slate-800">
                            <input type="text" value="${item.bait1 || ''}" onfocus="setBarisAktip(${index})" oninput="updateDataNadoman(${index}, 'bait1', this.value)" class="w-1/2 p-1 bg-slate-900 text-slate-100 text-xs rounded border border-slate-700" placeholder="Padalisan 1">
                            <input type="text" value="${item.bait2 || ''}" onfocus="setBarisAktip(${index})" oninput="updateDataNadoman(${index}, 'bait2', this.value)" class="w-1/2 p-1 bg-slate-900 text-slate-100 text-xs rounded border border-slate-700" placeholder="Padalisan 2">
                        </div>
                    `;
                } else {
                    htmlKontenInput = `
                        <div class="w-[16%] text-[10px] font-bold text-amber-400 uppercase">Bandongan</div>
                        <div class="w-[72%] flex gap-1">
                            <input type="text" value="${item.luhur || ''}" onfocus="setBarisAktip(${index})" oninput="updateDataBandongan(${index}, 'luhur', this.value)" class="w-1/3 p-1 bg-slate-950 text-slate-100 text-[10px] italic rounded border border-slate-700" placeholder="Luhur">
                            <input type="text" value="${item.arab || ''}" onfocus="setBarisAktip(${index})" oninput="updateDataBandongan(${index}, 'arab', this.value)" class="w-1/3 p-1 bg-slate-950 text-slate-100 font-arab text-sm text-right rounded border border-slate-700" placeholder="Arab">
                            <input type="text" value="${item.sunda || ''}" onfocus="setBarisAktip(${index})" oninput="updateDataBandongan(${index}, 'sunda', this.value)" class="w-1/3 p-1 bg-slate-950 text-slate-100 text-[10px] rounded border border-slate-700" placeholder="Sunda">
                        </div>
                    `;
                }

                row.innerHTML = `
                    <div class="w-[6%] text-center cursor-grab text-slate-500 font-bold select-none text-xs">☰</div>
                    ${htmlKontenInput}
                    <div class="w-[6%] text-center"><button onclick="event.stopPropagation(); hapusBaris(${index})" class="text-red-400 text-xs font-bold cursor-pointer">✕</button></div>
                `;
                wadah.appendChild(row);
            });
        }

        function updateDataArabFull(idx, val) { 
            kitabData[indexFasalAktip].baris[idx].teks = val; 
            const wadah = document.getElementById('wadah-baris-input');
            if(wadah && wadah.children[idx]) {
                const visualBox = wadah.children[idx].querySelector('.bg-slate-950 > div');
                if(visualBox) visualBox.innerHTML = buatVisualLafadzKlik(val, idx);
            }
            prosesTeksMenjadiBooklet(); 
        }
        
        function updateDataBandongan(idx, field, val) { kitabData[indexFasalAktip].baris[idx][field] = val; prosesTeksMenjadiBooklet(); }
        function updateDataNadoman(idx, field, val) { kitabData[indexFasalAktip].baris[idx][field] = val; prosesTeksMenjadiBooklet(); }
        
        function setBarisAktip(index) { 
            indexBarisAktip = index; 
            const wadah = document.getElementById('wadah-baris-input');
            if(!wadah) return;
            Array.from(wadah.children).forEach((child, idx) => {
                if(idx === index) {
                    child.className = `flex gap-1.5 items-center p-1 bg-slate-800/80 rounded border border-amber-500 ring-1 ring-amber-500/30 transition`;
                } else {
                    child.className = `flex gap-1.5 items-center p-1 bg-slate-900/50 rounded border border-slate-800 transition`;
                }
            });
        }
        
        function tambahBaris(tipe) {
            if(tipe === 'arabfull') kitabData[indexFasalAktip].baris.push({ tipe: "arabfull", teks: "" });
            else if(tipe === 'nadoman') kitabData[indexFasalAktip].baris.push({ tipe: "nadoman", bait1: "", bait2: "" });
            else kitabData[indexFasalAktip].baris.push({ tipe: "bandongan", luhur: "", arab: "", sunda: "" });
            
            indexBarisAktip = kitabData[indexFasalAktip].baris.length - 1;
            renderBarisInput();
            prosesTeksMenjadiBooklet();
        }

        function hapusBaris(index) {
            kitabData[indexFasalAktip].baris.splice(index, 1);
            indexBarisAktip = Math.max(0, index - 1);
            renderBarisInput();
            prosesTeksMenjadiBooklet();
        }

        function handleDragStart(e) { barisNuKeurDiDrag = this; this.classList.add('baris-dragged'); }
        function handleDragOver(e) { if (e.preventDefault) e.preventDefault(); return false; }
        function handleDrop(e) {
            const indexAsal = parseInt(barisNuKeurDiDrag.getAttribute('data-index'));
            const indexTujuan = parseInt(this.getAttribute('data-index'));
            if (indexAsal !== indexTujuan) {
                const moved = kitabData[indexFasalAktip].baris.splice(indexAsal, 1)[0];
                kitabData[indexFasalAktip].baris.splice(indexTujuan, 0, moved);
                indexBarisAktip = indexTujuan;
                renderBarisInput();
                prosesTeksMenjadiBooklet();
            }
            return false;
        }
        function handleDragEnd() { renderBarisInput(); }

        function simpanKabehFasal() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(kitabData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr); dlAnchor.setAttribute("download", `Kitab_Studio.json`);
            dlAnchor.click();
        }

        function bukaDariFile(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                kitabData = JSON.parse(e.target.result);
                indexFasalAktip = 0; indexBarisAktip = 0; bukaFasalAktip();
            };
            reader.readAsText(file);
        }

        window.cetakBuku = function(jinis) {
            modeCetak = jinis;
            prosesTeksMenjadiBooklet();
            setTimeout(() => { window.print(); }, 300);
        };

        function prosesTeksMenjadiBooklet() {
    const wadahKertas = document.getElementById('wadah-kertas-cetak');
    const txtJudulPreview = document.getElementById('judul-preview');
    if (!wadahKertas) return;
    wadahKertas.innerHTML = ''; 

    if(txtJudulPreview) {
        txtJudulPreview.textContent = modeCetak === "terpilih" ? "Sawangan Cetak Buku (Ngan Fasal Nu Dipilih)" : "Sawangan Cetak Buku (Sadaya Fasal Ngagabung)";
    }

    const dataFasalDiProses = kitabData.filter(fasal => modeCetak === "sadaya" || fasal.dicitak !== false);

    if(dataFasalDiProses.length === 0) {
        wadahKertas.innerHTML = '<div class="text-center text-slate-500 py-12 text-xs">[Ulah hilap nyeklis fasal dina daptar pikeun dicitak]</div>';
        return;
    }

    const wadahBlokKonten = document.createElement('div');
    wadahBlokKonten.style.width = '141mm';
    wadahBlokKonten.className = "font-sans text-slate-900 text-left invisible absolute top-0 left-0";
    document.body.appendChild(wadahBlokKonten);

    dataFasalDiProses.forEach((fasal) => {
        const judulDiv = document.createElement('div');
        judulDiv.className = "w-full text-center my-2 border-b-2 border-slate-900 pb-0.5 elemen-cetak-tunggal";
        judulDiv.innerHTML = `<h2 class="text-xs font-extrabold tracking-wider text-slate-900 font-sans uppercase">${fasal.nama}</h2>`;
        wadahBlokKonten.appendChild(judulDiv);

        fasal.baris.forEach((item) => {
            if (item.tipe === 'arabfull') {
                if (item.teks && item.teks.trim()) {
                    const arabDiv = document.createElement('div');
                    arabDiv.className = "w-full text-center px-1 my-3 elemen-cetak-tunggal";
                    arabDiv.innerHTML = `<p class="font-arab text-xl font-medium leading-loose text-slate-950 tracking-wide text-center">${item.teks}</p>`;
                    wadahBlokKonten.appendChild(arabDiv);
                }
            } else if (item.tipe === 'nadoman') {
                // 🛠️ PERBAIKAN 1: Gunakeun Tabel pikeun Nadoman ngarah posisi kénca-katuhu aman di mode print
                const nadoDiv = document.createElement('div');
                nadoDiv.className = "w-full text-xs font-sans text-slate-900 mb-2 border-t border-b border-gray-400 py-1 space-y-0.5 elemen-cetak-tunggal";
                nadoDiv.innerHTML = `
                    <table class="w-full text-[11px] border-b border-dotted border-gray-300 px-1" style="table-layout: fixed; width: 100%;">
                        <tr>
                            <td class="text-left font-medium text-slate-900 align-top" style="width: 47%; word-wrap: break-word;">${item.bait1 || '&nbsp;'}</td>
                            <td class="text-center font-bold text-gray-400 align-top" style="width: 6%;">#</td>
                            <td class="text-left font-medium text-slate-900 align-top" style="width: 47%; word-wrap: break-word;">${item.bait2 || '&nbsp;'}</td>
                        </tr>
                    </table>`;
                wadahBlokKonten.appendChild(nadoDiv);

            } else if (item.tipe === 'bandongan') {
                // 🛠️ PERBAIKAN 2: Paksa inline CSS w-[20%] ngarah teu ka-override nalika nyetak
                const boxBandongan = document.createElement('div');
                boxBandongan.className = "border-r border-b border-gray-300 p-1 text-center bg-white min-h-[95px] elemen-cetak-tunggal kotak-bandongan-satuan box-border";
                
                // Setel gaya penting ieu liwat JavaScript pikeun meungpeuk CSS bawaan browser cetak
                boxBandongan.style.setProperty('width', '20%', 'important');
                boxBandongan.style.setProperty('flex', '0 0 20%', 'important');
                boxBandongan.style.setProperty('display', 'flex', 'important');
                boxBandongan.style.setProperty('flex-direction', 'column', 'important');
                boxBandongan.style.setProperty('justify-content', 'space-between', 'important');
                boxBandongan.style.setProperty('align-items', 'center', 'important');

                boxBandongan.innerHTML = `
                    <span class="text-[8px] text-gray-400 italic font-sans block w-full" style="direction: ltr;">${item.luhur || '&nbsp;'}</span>
                    <span class="font-arab text-base font-bold text-slate-900 leading-normal my-auto block w-full">${item.arab || '&nbsp;'}</span>
                    <span class="text-[8px] text-slate-600 font-sans block w-full" style="direction: ltr;">${item.sunda || '&nbsp;'}</span>
                `;
                wadahBlokKonten.appendChild(boxBandongan);
            }
        });

        if (fasal.rangkuman && fasal.rangkuman.trim()) {
            let barisTeks = fasal.rangkuman.split('\n');
            let htmlBarisRangkuman = '';
            barisTeks.forEach((baris) => {
                let styleIndent = /^\s*\d+\./.test(baris.trim()) ? 'padding-left: 24px;' : '';
                htmlBarisRangkuman += `<div class="text-[11px] font-sans text-slate-900 tracking-wide font-medium" style="${styleIndent}">${baris}</div>`;
            });

            const rangkumanDiv = document.createElement('div');
            rangkumanDiv.className = "w-full mt-4 mb-2 font-sans elemen-cetak-tunggal";
            rangkumanDiv.innerHTML = `
                <div class="text-xs font-bold text-slate-950 uppercase underline tracking-wider mb-1">RANGKUMAN</div>
                <div class="wadah-rangkuman-cetak border-t border-gray-300">
                    ${htmlBarisRangkuman}
                </div>
            `;
            wadahBlokKonten.appendChild(rangkumanDiv);
        }
    });

    let wadahKoleksiHalamanMentah = [];
    let nomorHalamanVirtual = 1;

    let halamanDOMVirtual = buatHalamanDOMVirtual(nomorHalamanVirtual);
    wadahKertas.appendChild(halamanDOMVirtual); 
    let targetDiv = halamanDOMVirtual.querySelector('.isi-konten-halaman');

    const TINGGI_MAKSIMAL = 690; 
    const kumpulanElemen = Array.from(wadahBlokKonten.children);

    let gridOtomatisSekarang = null;

    // 🛠️ PERBAIKAN 3: Robah grid-cols-5 jadi flex, force justify-center
    function jieunGridAnyar() {
        const gridDiv = document.createElement('div');
        gridDiv.className = "border-t border-l border-gray-300 my-2 wadah-grid-induk w-full";
        gridDiv.style.direction = "rtl";
        
        // Maksa ngagunakeun flex tur nengahkeun (center) di print preview
        gridDiv.style.setProperty('display', 'flex', 'important');
        gridDiv.style.setProperty('flex-wrap', 'wrap', 'important');
        gridDiv.style.setProperty('justify-content', 'center', 'important');
        
        targetDiv.appendChild(gridDiv);
        gridOtomatisSekarang = gridDiv;
    }

    kumpulanElemen.forEach((el) => {
        let nodeKlon = el.cloneNode(true);
        
        if (nodeKlon.classList.contains('kotak-bandongan-satuan')) {
            if (!gridOtomatisSekarang) {
                jieunGridAnyar();
            }
            gridOtomatisSekarang.appendChild(nodeKlon);
        } else {
            gridOtomatisSekarang = null;
            targetDiv.appendChild(nodeKlon);
        }

        if (targetDiv.offsetHeight > TINGGI_MAKSIMAL) {
            if (nodeKlon.classList.contains('kotak-bandongan-satuan') && gridOtomatisSekarang) {
                gridOtomatisSekarang.removeChild(nodeKlon);
                if (gridOtomatisSekarang.children.length === 0) gridOtomatisSekarang.remove();
            } else {
                targetDiv.removeChild(nodeKlon);
            }

            wadahKoleksiHalamanMentah.push(halamanDOMVirtual.innerHTML);
            halamanDOMVirtual.remove();

            nomorHalamanVirtual++;
            halamanDOMVirtual = buatHalamanDOMVirtual(nomorHalamanVirtual);
            wadahKertas.appendChild(halamanDOMVirtual);
            targetDiv = halamanDOMVirtual.querySelector('.isi-konten-halaman');
            
            nodeKlon = el.cloneNode(true);
            if (nodeKlon.classList.contains('kotak-bandongan-satuan')) {
                jieunGridAnyar();
                gridOtomatisSekarang.appendChild(nodeKlon);
            } else {
                gridOtomatisSekarang = null;
                targetDiv.appendChild(nodeKlon);
            }
        }
    });

    wadahKoleksiHalamanMentah.push(halamanDOMVirtual.innerHTML);
    halamanDOMVirtual.remove();
    
    wadahKertas.innerHTML = ''; 
    document.body.removeChild(wadahBlokKonten);

    while (wadahKoleksiHalamanMentah.length % 4 !== 0) {
        nomorHalamanVirtual++;
        let blankPage = buatHalamanDOMVirtual(nomorHalamanVirtual);
        blankPage.querySelector('.isi-konten-halaman').innerHTML = `<div class="text-center text-gray-300 italic pt-24 text-xs">[Catetan Kosong]</div>`;
        wadahKoleksiHalamanMentah.push(blankPage.innerHTML);
    }

    let totalHalaman = wadahKoleksiHalamanMentah.length;
    for (let i = 0; i < totalHalaman / 4; i++) {
        let depanKiri = totalHalaman - 1 - (i * 2), depanKanan = 0 + (i * 2);
        let lembarF4Depan = document.createElement('div');
        lembarF4Depan.className = "lembar-f4-cetak";
        lembarF4Depan.innerHTML = `
            <div class="garis-lipat"></div>
            <div class="sub-halaman border-r border-gray-100">${wadahKoleksiHalamanMentah[depanKiri]}</div>
            <div class="sub-halaman">${wadahKoleksiHalamanMentah[depanKanan]}</div>
        `;
        wadahKertas.appendChild(lembarF4Depan);

        let belakangKiri = 1 + (i * 2), belakangKanan = totalHalaman - 2 - (i * 2);
        let lembarF4Belakang = document.createElement('div');
        lembarF4Belakang.className = "lembar-f4-cetak";
        lembarF4Belakang.innerHTML = `
            <div class="garis-lipat"></div>
            <div class="sub-halaman border-r border-gray-100">${wadahKoleksiHalamanMentah[belakangKiri]}</div>
            <div class="sub-halaman">${wadahKoleksiHalamanMentah[belakangKanan]}</div>
        `;
        wadahKertas.appendChild(lembarF4Belakang);
    }

    const panelPreview = document.getElementById('wadah-kertas-cetak')?.parentElement;
    if (panelPreview) {
        panelPreview.scrollTop = panelPreview.scrollHeight;
    }
}

        function buatHalamanDOMVirtual(no) {
            const tempDiv = document.createElement('div');
            tempDiv.className = "w-full h-full flex flex-col justify-between";
            tempDiv.innerHTML = `
                <div class="isi-konten-halaman flex-1 overflow-hidden"></div>
                <div class="text-center font-mono text-[9px] text-gray-400 border-t border-gray-200 pt-1 mt-1 flex justify-between px-1">
                    <span>Kitab Safinah</span>
                    <span class="font-bold text-slate-800 text-[10px] bg-slate-100 px-2 rounded-full">- ${no} -</span>
                    <span>Matan, Lughot, Ringkesan & Nadoman</span>
                </div>
            `;
            return tempDiv; // Parantos ditambahkeun return element DOM na di dieu
        }

        window.onload = function() { 
            bukaFasalAktip(); 
            toggleAccordion('acc-rangkuman', 'panah-rangkuman');
        };

        function cetakBuku(mode) {
            console.log("Ngamimitian prosés cetak mode: " + mode);
            
            const wadahKertas = document.getElementById('wadah-kertas-cetak');
            if (!wadahKertas || wadahKertas.children.length === 0) {
                alert("Teu aya data anu tiasa dicetak! Punten eusian heula kitabna.");
                return;
            }

            // Upami mode nu dipilih nyaeta 'terpilih' (fasal nu nuju aktip hungkul)
            if (mode === 'terpilih') {
                // Logika tambahan dumasar kana struktur fasal anjeun.
                // Upami ayeuna sadaya halaman parantos otomatis render di preview,
                // anjeun tiasa langsung manggil window.print().
                window.print();
            } else {
                // Mode 'sadaya' - langsung nyetak sadaya anu aya di wadah-kertas-cetak
                window.print();
            }
        }
        
        const SUPABASE_URL = 'https://ilyryehrupwgktoklsbt.supabase.co'; // Copy ti dashboard
        const SUPABASE_ANON_KEY = 'sb_publishable_n_BNMZN5UO6Jo5JaLt8Uyg_wgKyqw-j'; // Copy tina gambar
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Fungsi simpan data
        async function simpanKaSupabase(nama, data) {
            const { error } = await supabase
                .from('kitab_data')
                .upsert({ nama_kitab: nama, konten: data });
            
            if (error) {
                alert("Aduh, aya masalah: " + error.message);
            } else {
                alert("Alhamdulillah, data tos tersimpan di server Supabase!");
            }
        }
</script>
